name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    env:
      # Override the local-dev target-dir from src-tauri/.cargo/config.toml
      # (which points at a user-specific path that doesn't exist on the runner).
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          body=$(node scripts/extract-changelog.mjs "${{ github.ref_name }}")
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo ""
            echo "---"
            echo ""
            echo "**Pobierz instalator dla swojego systemu poniżej:**"
            echo "- macOS: \`*.dmg\` (Universal — Intel + Apple Silicon)"
            echo "- Windows: \`*-setup.exe\` (NSIS)"
            echo ""
            echo "Aplikacja sprawdzi aktualizacje automatycznie po uruchomieniu."
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download ffmpeg sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/download-ffmpeg.sh macos

      - name: Download ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $dir = "$env:RUNNER_TEMP\ffmpeg-extracted"
          # Version-pinned package + SHA-256 — keep URL and hash in sync with
          # scripts/download-ffmpeg.sh (WIN_URL / WIN_SHA).
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip" -OutFile $zip
          $expected = "db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec"
          $got = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $expected) { throw "ffmpeg archive SHA-256 mismatch: expected $expected, got $got" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in archive" }
          Copy-Item -Path $exe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Build llama-server sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-llama-server.sh macos

      - name: Build llama-server sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: bash scripts/build-llama-server.sh windows

      - name: Build & release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TranscriptPRO ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          # Tags containing a dash (v0.1.3-rc.1, v0.2.0-beta, etc.) are prereleases.
          # GitHub omits prereleases from /releases/latest/, so installed clients
          # ignore them — letting us test the full DMG/EXE/updater path without
          # affecting users on stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
