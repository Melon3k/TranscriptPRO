name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Download ffmpeg sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/download-ffmpeg.sh macos

      - name: Download ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $dir = "$env:RUNNER_TEMP\ffmpeg-extracted"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in archive" }
          Copy-Item -Path $exe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      # tauri-action with no tagName performs build+bundle without publishing.
      # We re-use the exact same action + args + signing env as release.yml so
      # this CI is a high-fidelity dry run of the public release path. Signing
      # secrets must be present because the pubkey in tauri.conf.json makes
      # the bundler require a matching private key when createUpdaterArtifacts
      # is on. Safe for same-repo PRs (no external forks have access).
      - name: Build Tauri app (no release)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranscriptPRO-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7
