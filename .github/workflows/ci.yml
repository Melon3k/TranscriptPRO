name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # NOTE: do NOT add matrix keys here — GitHub bakes every matrix value
        # into the auto-generated job name, which is the required-status-check
        # CONTEXT the `main` ruleset pins ("build (macos-latest, …)" /
        # "build (windows-latest)"). A new key renames the check and blocks every
        # merge on a phantom context. Per-platform values go in step `env:` via
        # an expression instead (see the burn-smoke test step).
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Download ffmpeg sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/download-ffmpeg.sh macos

      - name: Download ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $dir = "$env:RUNNER_TEMP\ffmpeg-extracted"
          # Version-pinned package + SHA-256 — keep URL and hash in sync with
          # scripts/download-ffmpeg.sh (WIN_URL / WIN_SHA).
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip" -OutFile $zip
          $expected = "db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec"
          $got = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $expected) { throw "ffmpeg archive SHA-256 mismatch: expected $expected, got $got" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in archive" }
          Copy-Item -Path $exe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Build llama-server sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-llama-server.sh macos

      - name: Build llama-server sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: bash scripts/build-llama-server.sh windows

      # Tests run before the bundle build so a red test fails the PR fast. Both
      # sidecars must already exist above: the Rust build script treats them as
      # required externalBin resources. The burn smoke exercises the real
      # shipped ffmpeg (which carries libass) via TPRO_TEST_FFMPEG; if that
      # binary ever lacked the `ass` filter the smoke would skip (logged), not
      # silently pass.
      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Rust tests incl. MP4 burn-in smoke
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
        env:
          # Per-platform via expression (NOT a matrix key — see the matrix note).
          # macOS: the universal fat binary runs on the runner arch. Relative to
          # the workspace root; the test canonicalizes it to an absolute path.
          TPRO_TEST_FFMPEG: ${{ matrix.platform == 'windows-latest' && 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe' || 'src-tauri/binaries/ffmpeg-universal-apple-darwin' }}

      # tauri-action with no tagName performs build+bundle without publishing.
      # We re-use the exact same action + args + signing env as release.yml so
      # this CI is a high-fidelity dry run of the public release path. Signing
      # secrets must be present because the pubkey in tauri.conf.json makes
      # the bundler require a matching private key when createUpdaterArtifacts
      # is on. Safe for same-repo PRs (no external forks have access).
      - name: Build Tauri app (no release)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranscriptPRO-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7
