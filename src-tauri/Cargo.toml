[package]
name = "transcript-pro"
version = "0.1.3"
description = "TranscriptPRO - Desktop subtitle editor with Whisper transcription"
authors = ["TranscriptPRO"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transcript_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Single-instance guard: a 2nd launch focuses the running window instead of
# starting a rival process (which would otherwise reap the 1st instance's live
# llama-server via the startup sweep).
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

reqwest = { version = "0.12", features = ["json", "stream"] }
# API keys: one random master key lives in the OS credential store (macOS Keychain /
# Windows Credential Manager / Linux Secret Service); the keys themselves are stored
# AES-GCM-encrypted in app-data. One keychain item → at most one macOS ACL prompt.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
hex = "0.4"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# Integrity check for models downloaded from community mirrors.
sha2 = "0.10"
thiserror = "2"
regex = "1"
# Decode legacy-encoded subtitle files (e.g. Windows-1250 Polish SRTs) on import.
encoding_rs = "0.8"
# Pure-Rust system-font enumeration (no system libs) for the caption font picker.
fontdb = "0.23"
# Pure-Rust glyph metrics (advance widths + hhea/OS2 vertical metrics) used to
# measure caption text for the text-hugging background pill. Matches the version
# fontdb 0.23 pulls in transitively, so no extra crate is added to the lock.
ttf-parser = "0.25"
# whisper-rs Metal backend is macOS-only (links Apple's Foundation.framework).
# Windows/Linux fall back to the default CPU backend.
whisper-rs-sys = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"
